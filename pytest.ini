[pytest]
markers =
    smoke: chama a API real da OpenAI (custa e não é 100% determinístico). Roda só com `pytest -m smoke` e OPENAI_API_KEY configurada — fora disso, fica de fora do `pytest -m "not smoke"` usado no CI.
    unitario: testes unitários — funções puras, sem rede.
    eval: eval do agente com a API real contra tests/eval_dataset.jsonl (~40 chamadas). Roda com `pytest -m eval` e OPENAI_API_KEY configurada; fica de fora do `pytest -m "not smoke and not eval"` do gate de testes.
